[package]
name = "hebrew_accents"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Roest Dev <github.ebook242@passinbox.com>"]
description = "A library for finding, filtering, and displaying Hebrew accents, specifically focusing on the Tiberian accent system as documented by the Masoretes"
keywords = [
    "hebrew",
    "cantillation_symbols",
    "teʿamim",
    "taʿamei ha-mikra",
    "utf-8",
]
documentation = "https://docs.rs/crate/hebrew_accents/"
repository = "https://github.com/Roestdev/hebrew_accents/"
categories = ["text-processing"]
readme = "README.md"
#rust-version = "1.56.1"

[dependencies]
fancy-regex = "0.19.0"
hebrew_unicode_script = "2.0.0"
once_cell = "1.21.4"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"
regex = "1.12.4"
